# Default ring schedule. Master v4 §3.1.
# Cell size tracks the sensor's own azimuthal sample spacing s_az = r * dtheta
# to within 1.15x at every boundary. Finer than s_az adds no information.
name: "5_10_20_40"   # quoted: YAML reads 5_10_20_40 as the integer 5102040
base_cell_m: 0.05

rings:
  - {ring: 0, half_width_m: 10,  cell_m: 0.05, cells: 160000, s_az_cm: 3.5}
  - {ring: 1, half_width_m: 25,  cell_m: 0.10, cells: 210000, s_az_cm: 8.7}
  - {ring: 2, half_width_m: 50,  cell_m: 0.20, cells: 187500, s_az_cm: 17.5}
  - {ring: 3, half_width_m: 100, cell_m: 0.40, cells: 187500, s_az_cm: 34.9}

total_cells: 745000   # 8.94 MB at 12 B/cell

vertical_extent_m: [-3.5, 4.5]   # overpasses and multi-storey are out of scope

# Split at R_L, merge only at R_L * (1 + eps). Without hysteresis a cell on a
# boundary splits and merges every frame as the vehicle changes speed, burning
# the refinement pool and inflating variance each cycle (math §5, Theorem 1).
hysteresis_eps: 0.1

anisotropy:            # master v4 §3.2 -- take it from the sides, not the back
  kappa_forward: 1.0
  kappa_side: 0.5
  v_ref_ms: 15.0
  rear_stretch: 1.0            # never stretched
  rear_floor_cell_m: 0.20      # never coarser than 20 cm within 50 m behind
